{% extends 'base.html' %}

{% block content %}
  <h1>Listagem de Produto</h1>
  {% csrf_token %}

    {% for produto in produtos %}
  <form action="{% url 'excluir_produto' produto.pk %}" method="post">
    {% csrf_token %}
    <p> {{ produto.id }} - {{ produto.nome }}
    <button type="submit" class = "btn btn-danger" onclick="return confirm('Produto excluido com sucesso!')">Excluir</button>
  </p>
  {% endfor %}

</form>
{% csrf_token %}

{% endblock %}
